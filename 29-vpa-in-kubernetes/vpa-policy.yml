apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
 name: vpa-demo
spec:
 targetRef:
  apiVersion: apps/v1
  kind: Deployment
  name: vpa-demo
 updatePolicy:
  updateMode: Recreate
 resourcePolicy:
  containerPolicies:
   - containerName: app
     minAllowed:
      cpu: 100m
      memory: 50Mi
     maxAllowed:
      cpu: 1
      memory: 500Mi
     controlledResources:
      - cpu
      - memory
     controlledValues: RequestsOnly
