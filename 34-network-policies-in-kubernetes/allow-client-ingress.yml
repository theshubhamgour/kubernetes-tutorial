apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
 name: allow-client-ingress
 namespace: network-policy-demo
spec:
 podSelector:
  matchLabels:
   app: backend
 policyTypes:
  - Ingress 
 ingress:
  - from:
     - podSelector:
        matchLabels: 
          app: client
    ports:
     - protocol: TCP
       port: 80
