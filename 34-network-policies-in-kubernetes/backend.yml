apiVersion: apps/v1
kind: Deployment
metadata:
 name: backend
 namespace: network-policy-demo
 labels:
  app: backend
spec:
 replicas: 1
 selector:
  matchLabels:
   app: backend
 template:
  metadata:
   labels:
    app: backend
  spec:
   containers:
    - name: nginx
      image: nginx:stable
      ports:
       - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
 name: backend-service
 namespace: network-policy-demo
spec:
 type: ClusterIP
 selector:
  app: backend
 ports:
  - port: 80
    targetPort: 80
