apiVersion: v1
kind: Pod
metadata:
 name: affinity-pod
spec:
 affinity:
  nodeAffinity:
   requiredDuringSchedulingIgnoredDuringExecution:
    nodeSelectorTerms:
     - matchExpressions:
        - key: disk-type
          operator: In
          values:
           - ssd
 containers:
  - name: demo-pod
    image: nginx:latest
