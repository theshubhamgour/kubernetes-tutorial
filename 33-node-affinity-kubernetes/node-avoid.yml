apiVersion: v1
kind: Pod
metadata:
 name: avoid-affinity-pod
spec:
 affinity:
  nodeAffinity:
   requiredDuringSchedulingIgnoredDuringExecution:
    nodeSelectorTerms:
     - matchExpressions:
        - key: disk-type
          operator: NotIn
          values:
           - ssd
 containers:
  - name: demo-pod-1
    image: nginx:latest
