apiVersion: v1
kind: Pod
metadata:
  name: nginx-toleration-pod
spec:
  nodeSelector:
    kubernetes.io/hostname: taints-demo-m03
  tolerations:
    - key: dedicated
      operator: Equal
      value: demo
      effect: NoSchedule
  containers:
    - name: nginx
      image: nginx:stable
      ports:
        - containerPort: 80
