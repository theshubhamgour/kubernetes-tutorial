apiVersion: v1
kind: Pod
metadata:
 name: dynamic-storage-pod
spec:
 containers:
  - name: application-storage
    image: busybox
    command:
     - sh
     - -c
     - sleep 3600
    volumeMounts:
     - name: app-storage
       mountPath: /data

 volumes:
  - name: app-storage
    persistentVolumeClaim:
     claimName: dynamic-pvc
