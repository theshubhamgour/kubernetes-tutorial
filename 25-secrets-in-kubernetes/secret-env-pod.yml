apiVersion: v1
kind: Pod
metadata:
 name: secret-env-pod
spec:
 containers:
  - name: app
    image: busybox
    command:
     - sh
     - -c
     - sleep 3600
    env:
     - name: DB_USERNAME
       valueFrom:
        secretKeyRef:
         name: db-credentials
         key: username 
     - name: DB_PASSWORD
       valueFrom:
        secretKeyRef:
         name: db-credentials
         key: password
